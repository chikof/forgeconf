[package]
name = "forgeconf"
description = "Declarative configuration loader for Rust structs powered by attribute macros."
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
authors = ["Chiko <chiko@envs.net>"]
license = "MIT"
keywords = ["configuration", "macro", "toml", "yaml", "json"]
readme = "../README.md"
repository = "https://github.com/chikof/forgeconf"

[features]
default = ["toml", "cli"]
dotenv = []
watch = []
toml = []
yaml = []
json = []
cli = []

[dependencies]
forgeconf_macros = { version = "=1.0.0", path = "../forgeconf_macros" }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
