[package]
name = "forgeconf"
description = "Declarative configuration loader for Rust structs powered by attribute macros."
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
authors = ["Chiko <chiko@envs.net>"]
license = "MIT"
keywords = ["configuration", "macro", "toml", "yaml", "json"]
readme = "../README.md"
repository = "https://github.com/chikof/forgeconf"

[features]
default = ["toml", "yaml", "cli"]
dotenv = []
watch = ["dep:notify"]
toml = []
yaml = []
json = []
cli = []
clap = ["forgeconf_macros/clap", "cli", "dep:clap"]

[dependencies]
forgeconf_macros = { version = "=0.5.0", path = "../forgeconf_macros" }
clap = { version = "4", optional = true, features = ["derive"] }
notify = { version = "9.0.0-rc.4", optional = true }

[dev-dependencies]
tempfile = "3.27.0"
