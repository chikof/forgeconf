[package]
name = "forgeconf-benchmarks"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[dependencies]
forgeconf = { path = "../../forgeconf", features = ["toml", "json", "yaml", "cli"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
serde_json = "1.0.154"
serde_yaml = "0.9.34"
confique = { version = "0.4.0", features = ["toml", "yaml"] }
clap = { version = "4.6.7", features = ["derive"] }

[dev-dependencies]
config = { version = "0.15.27", features = ["toml", "json", "yaml"] }
figment = { version = "0.10.19", features = ["toml", "json", "yaml", "env"] }
criterion = "0.8.2"

[[bench]]
name = "compare"
harness = false
