[package]
name = "forgeconf_macros"
description = "Procedural macro crate for Forgeconf."
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
authors = ["Chiko <chiko@envs.net>"]
license = "MIT"
repository = "https://github.com/chikof/forgeconf"
readme = "../README.md"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.106"
quote = "1.0.45"
syn = { version = "2.0.117", features = ["full"] }

[lints]
workspace = true
